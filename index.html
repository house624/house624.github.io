<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Picture Perfect Window Solutions has closed. Thank you to our customers and community for your support.">
  <link rel="canonical" href="https://pictureperfectwindowsolutions.com/">
  <title>Business Closure | Picture Perfect Window Solutions</title>
  <style>
    :root { color-scheme: light; --blue: #0056b3; --ink: #1e293b; --muted: #475569; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f8fafc;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 44rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid #e2e8f0;
      border-top: 6px solid var(--blue);
      border-radius: 0.75rem;
      background: #fff;
      box-shadow: 0 8px 30px rgb(15 23 42 / 7%);
      text-align: center;
    }
    .brand { margin: 0 0 1.5rem; color: var(--blue); font-size: 1rem; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; }
    p { margin: .75rem 0; color: var(--muted); font-size: 1.1rem; }
    .thanks { margin-top: 1.5rem; font-weight: 600; color: var(--ink); }
    footer { margin-top: 2rem; color: #64748b; font-size: .9rem; }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .35s ease-out both; } @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <main>
    <p class="brand">PICTURE PERFECT WINDOW SOLUTIONS</p>
    <h1>We have closed</h1>
    <p>Picture Perfect Window Solutions is no longer in business and is no longer accepting service requests.</p>
    <p class="thanks">Thank you to our customers and community for your support.</p>
    <footer>We're grateful for the trust you placed in us.</footer>
  </main>
</body>
</html>
